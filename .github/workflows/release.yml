name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore LockGate.sln

      - name: Run Tests
        run: dotnet run --project tests/LockGate.Core.Tests -c Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Package Release & Compile Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version -or $version -eq "${{ github.ref }}") { $version = "1.0.0" }
          .\scripts\package.ps1 -Version $version

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = (Get-ChildItem -Path release -File).FullName
          Write-Host "Found assets to upload:"
          $assets | ForEach-Object { Write-Host " - $_" }

          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, uploading/overwriting assets..."
            gh release upload $tag @assets --clobber
          } else {
            Write-Host "Creating release $tag..."
            gh release create $tag @assets --title "LockGate $tag - Windows Native App Locker" --generate-notes
          }
