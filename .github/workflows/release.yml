name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore LockGate.sln

      - name: Run Tests
        run: dotnet run --project tests/LockGate.Core.Tests -c Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Package Release & Compile Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version -or $version -eq "${{ github.ref }}") { $version = "1.0.0" }
          .\scripts\package.ps1 -Version $version

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/LockGate-Setup-*.exe
            release/LockGate-*-windows-x64.zip
            release/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
